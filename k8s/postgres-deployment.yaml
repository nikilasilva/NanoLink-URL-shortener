apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qr-postgres
  template:
    metadata:
      labels:
        app: qr-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: testuser
            - name: POSTGRES_PASSWORD
              value: testpass
            - name: POSTGRES_DB
              value: testdb
          ports:
            - containerPort: 5432
          volumeMounts: 
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qr-postgres
spec:
  selector:
    app: qr-postgres
  ports:
    - port: 5432
      targetPort: 5432

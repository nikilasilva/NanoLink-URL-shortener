apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qr-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: nanolink.local
      http:
        paths:
          # Backend API routes with rewrite
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: qr-backend-service
                port:
                  number: 5000

          # Short URL redirects (no rewrite needed - backend handles this)
          - path: /([a-zA-Z0-9_-]+)$
            pathType: ImplementationSpecific
            backend:
              service:
                name: qr-backend-service
                port:
                  number: 5000

          # Frontend - MUST be last, no rewrite
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qr-frontend-service
                port:
                  number: 3000

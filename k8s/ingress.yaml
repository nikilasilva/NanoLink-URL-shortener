apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qr-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: nanolink.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: qr-backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qr-frontend-service
                port:
                  number: 3000
